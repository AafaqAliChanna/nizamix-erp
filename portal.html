<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--
    =========================================================================
    WHY THIS IS A SEPARATE FILE FROM index.html - read this first.

    index.html is the STAFF app - it has a big sidebar with 15+ admin
    pages, and everything in it assumes "whoever's logged in is a member
    of staff" (it looks them up in the `staff` table). A parent is NOT
    staff. If we tried to cram a parent view into the same file, we'd
    need to constantly check "wait, is this person staff or a parent?"
    on every single page, and a parent would see a sidebar full of
    buttons meant for running the school, not for checking on their kid.

    So this is its own small app instead - same Supabase project (same
    URL and key, since both apps talk to the same database), but its
    own simple login, its own simple set of tabs, and nothing a parent
    doesn't need to see. Much easier to keep parents safely in their own
    lane this way.
    =========================================================================
-->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #1e40af;
        --primary-dark: #1e3a8a;
        --bg-light: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-dark: #0f172a;
        --text-light: #64748b;
    }
    body { font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

    .login-container { display: flex; width: 100%; min-height: 100vh; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); align-items: center; justify-content: center; padding: 20px; }
    .login-container.hide { display: none; }
    .login-box { background: var(--card-bg); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .login-box h2 { margin-bottom: 6px; }
    .login-box p { color: var(--text-light); margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; }
    .login-message { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
    .login-message.error { display: block; background: #fee2e2; color: #991b1b; }
    .login-message.success { display: block; background: #dcfce7; color: #166534; }

    .app-container { display: none; max-width: 900px; margin: 0 auto; padding: 24px; }
    .app-container.show { display: block; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); }
    .top-bar h1 { font-size: 20px; }
    .top-bar p { color: var(--text-light); font-size: 13px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-light); }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h3 { margin-bottom: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { color: var(--text-light); font-size: 12px; text-transform: uppercase; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .empty-state { text-align: center; color: var(--text-light); padding: 20px; }

    .no-print {}
    @media print {
        body * { visibility: hidden; }
        #printOverlay, #printOverlay * { visibility: visible; }
        #printOverlay { position: absolute; top: 0; left: 0; }
        .no-print { display: none !important; }
    }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-box">
        <h2>Parent Portal</h2>
        <p>Sign in to view your child's information</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input id="loginEmail" type="email" placeholder="Email" required>
            <input id="loginPassword" type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>
        <div id="loginMessage" class="login-message"></div>
    </div>
</div>

<!-- MAIN APP -->
<div class="app-container" id="appContainer">
    <div class="top-bar">
        <div>
            <h1 id="topSchoolName">School</h1>
            <p id="topParentName"></p>
        </div>
        <div class="no-print" style="display: flex; align-items: center; gap: 12px;">
            <!-- Only shows if a parent has more than one child at this school -->
            <select id="childSelector" style="display: none; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px;" onchange="switchChild()"></select>
            <button class="btn" onclick="handleLogout()">Log Out</button>
        </div>
    </div>

    <div class="tabs no-print">
        <button class="tab-btn active" data-tab="attendance" onclick="switchTab('attendance')"><i class="fas fa-calendar-check"></i> Attendance</button>
        <button class="tab-btn" data-tab="homework" onclick="switchTab('homework')"><i class="fas fa-tasks"></i> Homework</button>
        <button class="tab-btn" data-tab="exams" onclick="switchTab('exams')"><i class="fas fa-file-lines"></i> Exams</button>
        <button class="tab-btn" data-tab="fees" onclick="switchTab('fees')"><i class="fas fa-money-bill"></i> Fees</button>
        <button class="tab-btn" data-tab="messages" onclick="switchTab('messages')"><i class="fas fa-comments"></i> Messages</button>
        <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')"><i class="fas fa-bullhorn"></i> Announcements</button>
    </div>

    <!-- Attendance -->
    <div class="tab-page" id="tab-attendance">
        <div class="card">
            <h3>Attendance</h3>
            <p id="attSummary" style="color: var(--text-light); margin-bottom: 12px;"></p>
            <canvas id="attChart" height="150"></canvas>
        </div>
    </div>

    <!-- Homework -->
    <div class="tab-page" id="tab-homework" style="display: none;">
        <div class="card">
            <h3>Homework</h3>
            <table>
                <thead><tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th>Marks</th><th>Feedback</th></tr></thead>
                <tbody id="homeworkList"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Exams -->
    <div class="tab-page" id="tab-exams" style="display: none;">
        <div class="card">
            <h3>Exams</h3>
            <table>
                <thead><tr><th>Exam</th><th>Term</th><th></th></tr></thead>
                <tbody id="examsList"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Fees -->
    <div class="tab-page" id="tab-fees" style="display: none;">
        <div class="card">
            <h3>Fees</h3>
            <table>
                <thead><tr><th>Month</th><th>Amount Due</th><th>Status</th></tr></thead>
                <tbody id="feesList"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Messages -->
    <div class="tab-page" id="tab-messages" style="display: none;">
        <div class="card">
            <h3>Messages with Teachers</h3>
            <div id="messageThread" style="max-height: 350px; overflow-y: auto; margin-bottom: 16px;"></div>
            <div style="display: flex; gap: 8px;">
                <input id="newMessageBody" placeholder="Type a message..." style="flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px;">
                <button class="btn btn-primary" onclick="sendParentMessage()"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
    </div>

    <!-- Announcements -->
    <div class="tab-page" id="tab-announcements" style="display: none;">
        <div class="card">
            <h3>Announcements</h3>
            <div id="announcementsList"></div>
        </div>
    </div>
</div>

<!-- Printable report card overlay -->
<div id="printOverlay" style="display: none; position: fixed; inset: 0; background: white; z-index: 999; overflow-y: auto; padding: 40px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div class="no-print" style="margin-bottom: 24px; display: flex; gap: 10px;">
            <button class="btn" onclick="document.getElementById('printOverlay').style.display='none'"><i class="fas fa-times"></i> Close</button>
            <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print / Save as PDF</button>
        </div>
        <div id="printContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
    // Same Supabase project as the staff app (index.html) - parents and
    // staff both connect to the exact same database, just through two
    // different front-end pages with two different sets of database rules
    // (RLS policies) deciding what each of them can see.
    const supabaseClient = window.supabase.createClient(
        'https://ypiamdjdxploowjubibj.supabase.co',
        'sb_publishable_Ci3pvImXio3xZ3gk3PTsaA_wZar0bIn'
    );

    let CURRENT_SCHOOL_ID = null;
    let CURRENT_SCHOOL_NAME = '';
    let CURRENT_PARENT_NAME = '';
    let children = []; // [{id, full_name, class_id, ...}]
    let currentChildId = null;
    let attChartInstance = null;

    /*
        NEW: resolveParentContext()
        WHAT: after login, figures out who this parent is and which
        child(ren) belong to them - the parent-side equivalent of
        resolveSchoolContext() in the staff app.
        WHY we need BOTH the parent's own row AND their children: the
        parent row tells us their name and which school they belong to;
        the children list is what every other tab (Attendance, Homework,
        Fees...) is filtered by.
    */
    async function resolveParentContext() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return false;

        const { data: parentRow, error: parentError } = await supabaseClient
            .from('parents')
            .select('school_id, full_name')
            .eq('id', user.id)
            .maybeSingle();

        if (parentError || !parentRow) {
            alert('This account is not linked to a parent record. Contact the school office.');
            await supabaseClient.auth.signOut();
            return false;
        }

        CURRENT_SCHOOL_ID = parentRow.school_id;
        CURRENT_PARENT_NAME = parentRow.full_name;

        const { data: schoolRow } = await supabaseClient
            .from('schools')
            .select('name')
            .eq('id', CURRENT_SCHOOL_ID)
            .maybeSingle();
        CURRENT_SCHOOL_NAME = schoolRow?.name || 'School';

        const { data: childRows } = await supabaseClient
            .from('students')
            .select('id, full_name, class_id, classes(grade, section)')
            .in('id', (await supabaseClient.from('parent_students').select('student_id').eq('parent_id', user.id)).data.map(r => r.student_id));

        children = childRows || [];
        if (children.length === 0) {
            alert('No children are linked to this account yet. Contact the school office.');
            return false;
        }
        currentChildId = children[0].id;

        document.getElementById('topSchoolName').textContent = CURRENT_SCHOOL_NAME;
        document.getElementById('topParentName').textContent = `Parent: ${CURRENT_PARENT_NAME}`;
        document.title = CURRENT_SCHOOL_NAME + ' - Parent Portal';

        // Only show the child switcher if there's actually more than one -
        // no point showing a dropdown with one option in it.
        if (children.length > 1) {
            document.getElementById('childSelector').style.display = 'inline-block';
            document.getElementById('childSelector').innerHTML = children.map(c => `<option value="${c.id}">${c.full_name}</option>`).join('');
        }

        return true;
    }

    function switchChild() {
        currentChildId = document.getElementById('childSelector').value;
        loadAllTabs();
    }

    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            const ok = await resolveParentContext();
            if (ok) { showApp(); await loadAllTabs(); }
        }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            document.getElementById('loginMessage').className = 'login-message error';
            document.getElementById('loginMessage').textContent = error.message;
            return;
        }

        const ok = await resolveParentContext();
        if (!ok) return;
        showApp();
        await loadAllTabs();
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    function showApp() {
        document.getElementById('loginContainer').classList.add('hide');
        document.getElementById('appContainer').classList.add('show');
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-page').forEach(p => p.style.display = 'none');
        document.getElementById('tab-' + tabName).style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
    }

    async function loadAllTabs() {
        await loadAttendanceTab();
        await loadHomeworkTab();
        await loadExamsTab();
        await loadFeesTab();
        await loadMessagesTab();
        await loadAnnouncementsTab();
    }

    // ---- Attendance ----
    async function loadAttendanceTab() {
        const { data } = await supabaseClient
            .from('attendance')
            .select('status')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .eq('student_id', currentChildId);

        const rows = data || [];
        const present = rows.filter(r => r.status === 'present').length;
        const absent = rows.filter(r => r.status === 'absent').length;
        const pct = rows.length > 0 ? ((present / rows.length) * 100).toFixed(1) : '0.0';
        document.getElementById('attSummary').textContent = rows.length > 0
            ? `${pct}% present (${present} present, ${absent} absent, ${rows.length} days total)`
            : 'No attendance recorded yet';

        if (attChartInstance) attChartInstance.destroy();
        attChartInstance = new Chart(document.getElementById('attChart'), {
            type: 'doughnut',
            data: { labels: ['Present', 'Absent'], datasets: [{ data: [present, absent], backgroundColor: ['#166534', '#991b1b'] }] },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }

    // ---- Homework ----
    async function loadHomeworkTab() {
        const child = children.find(c => c.id === currentChildId);
        const { data } = await supabaseClient
            .from('homework')
            .select('id, title, subject, due_date')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .eq('class_id', child.class_id)
            .order('due_date', { ascending: false });

        const assignments = data || [];
        if (assignments.length === 0) {
            document.getElementById('homeworkList').innerHTML = '<tr><td colspan="6" class="empty-state">No homework yet</td></tr>';
            return;
        }

        // For each assignment, also fetch THIS child's own submission row -
        // parents only see their own child's status/marks/feedback, never
        // the whole class's.
        const rows = await Promise.all(assignments.map(async hw => {
            const { data: sub } = await supabaseClient
                .from('homework_submissions')
                .select('status, marks_obtained, feedback')
                .eq('homework_id', hw.id)
                .eq('student_id', currentChildId)
                .maybeSingle();
            return { hw, sub };
        }));

        document.getElementById('homeworkList').innerHTML = rows.map(({ hw, sub }) => `
            <tr>
                <td>${hw.title}</td>
                <td>${hw.subject || 'N/A'}</td>
                <td>${hw.due_date}</td>
                <td>${sub?.status || 'pending'}</td>
                <td>${sub?.marks_obtained ?? 'N/A'}</td>
                <td>${sub?.feedback || 'N/A'}</td>
            </tr>
        `).join('');
    }

    // ---- Exams / report cards ----
    async function loadExamsTab() {
        const child = children.find(c => c.id === currentChildId);
        const { data } = await supabaseClient
            .from('exams')
            .select('id, name, term, academic_year')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .eq('class_id', child.class_id)
            .order('created_at', { ascending: false });

        const exams = data || [];
        if (exams.length === 0) {
            document.getElementById('examsList').innerHTML = '<tr><td colspan="3" class="empty-state">No exams recorded yet</td></tr>';
            return;
        }

        document.getElementById('examsList').innerHTML = exams.map(ex => `
            <tr>
                <td>${ex.name}</td>
                <td>${ex.term} (${ex.academic_year})</td>
                <td><button class="btn btn-primary" onclick="viewReportCard('${ex.id}', '${ex.name.replace(/'/g, "\\'")}', '${ex.term}')">View Report Card</button></td>
            </tr>
        `).join('');
    }

    // Read-only version of the staff report card - same idea (subjects,
    // total, percentage), but no editing, no remarks box (parents can only
    // VIEW remarks the teacher already wrote, not add their own).
    async function viewReportCard(examId, examName, term) {
        const child = children.find(c => c.id === currentChildId);
        const [resultsRes, remarksRes] = await Promise.all([
            supabaseClient.from('exam_results').select('subject, marks_obtained, total_marks').eq('exam_id', examId).eq('student_id', currentChildId),
            supabaseClient.from('exam_remarks').select('remarks').eq('exam_id', examId).eq('student_id', currentChildId).maybeSingle()
        ]);

        const results = resultsRes.data || [];
        if (results.length === 0) {
            alert('No marks recorded for this exam yet.');
            return;
        }

        const totalObtained = results.reduce((s, r) => s + Number(r.marks_obtained), 0);
        const totalMax = results.reduce((s, r) => s + Number(r.total_marks), 0);
        const percentage = totalMax > 0 ? ((totalObtained / totalMax) * 100).toFixed(1) : '0.0';

        document.getElementById('printContent').innerHTML = `
            <div style="text-align: center; margin-bottom: 24px; border-bottom: 2px solid #333; padding-bottom: 16px;">
                <h2>${CURRENT_SCHOOL_NAME}</h2>
                <p>${examName} (${term})</p>
                <p style="font-weight: 600;">${child.full_name}</p>
            </div>
            <table style="width: 100%; border-collapse: collapse;">
                <thead><tr style="border-bottom: 2px solid #333;"><th style="text-align:left; padding:8px;">Subject</th><th style="text-align:right; padding:8px;">Marks</th><th style="text-align:right; padding:8px;">Total</th></tr></thead>
                <tbody>${results.map(r => `<tr><td style="padding:8px;">${r.subject}</td><td style="text-align:right; padding:8px;">${r.marks_obtained}</td><td style="text-align:right; padding:8px;">${r.total_marks}</td></tr>`).join('')}</tbody>
            </table>
            <p style="margin-top: 16px; font-size: 18px; font-weight: 700;">Total: ${totalObtained}/${totalMax} (${percentage}%)</p>
            <p style="margin-top: 8px;">Remarks: ${remarksRes.data?.remarks || 'None'}</p>
        `;
        document.getElementById('printOverlay').style.display = 'block';
    }

    // ---- Fees ----
    async function loadFeesTab() {
        const { data } = await supabaseClient
            .from('fee_invoices')
            .select('month, amount_due, paid')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .eq('student_id', currentChildId)
            .order('created_at', { ascending: false });

        const invoices = data || [];
        if (invoices.length === 0) {
            document.getElementById('feesList').innerHTML = '<tr><td colspan="3" class="empty-state">No fee records yet</td></tr>';
            return;
        }

        document.getElementById('feesList').innerHTML = invoices.map(inv => `
            <tr>
                <td>${inv.month}</td>
                <td>${inv.amount_due}</td>
                <td style="color: ${inv.paid ? '#166534' : '#991b1b'}; font-weight: 600;">${inv.paid ? 'Paid' : 'Unpaid'}</td>
            </tr>
        `).join('');
    }

    // ---- Messages ----
    async function loadMessagesTab() {
        const { data } = await supabaseClient
            .from('messages')
            .select('sender_role, body, created_at')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .eq('student_id', currentChildId)
            .order('created_at', { ascending: true });

        const messages = data || [];
        if (messages.length === 0) {
            document.getElementById('messageThread').innerHTML = '<p class="empty-state">No messages yet</p>';
            return;
        }

        document.getElementById('messageThread').innerHTML = messages.map(m => `
            <div style="display: flex; justify-content: ${m.sender_role === 'parent' ? 'flex-end' : 'flex-start'}; margin-bottom: 10px;">
                <div style="max-width: 70%; background: ${m.sender_role === 'parent' ? '#e0f2fe' : '#f1f5f9'}; padding: 10px 14px; border-radius: 10px;">
                    <p style="margin: 0; font-size: 0.75rem; color: var(--text-light); text-transform: capitalize;">${m.sender_role === 'parent' ? 'You' : 'Teacher'}</p>
                    <p style="margin: 4px 0 0 0;">${m.body}</p>
                </div>
            </div>
        `).join('');
    }

    async function sendParentMessage() {
        const body = document.getElementById('newMessageBody').value.trim();
        if (!body) return;

        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient.from('messages').insert({
            school_id: CURRENT_SCHOOL_ID,
            student_id: currentChildId,
            sender_role: 'parent',
            sender_id: user.id,
            body: body
        });

        if (error) {
            alert('Error sending message: ' + error.message);
            return;
        }

        document.getElementById('newMessageBody').value = '';
        await loadMessagesTab();
    }

    // ---- Announcements ----
    async function loadAnnouncementsTab() {
        const { data } = await supabaseClient
            .from('announcements')
            .select('title, body, created_at')
            .eq('school_id', CURRENT_SCHOOL_ID)
            .order('created_at', { ascending: false });

        const announcements = data || [];
        if (announcements.length === 0) {
            document.getElementById('announcementsList').innerHTML = '<p class="empty-state">No announcements yet</p>';
            return;
        }

        document.getElementById('announcementsList').innerHTML = announcements.map(a => `
            <div style="padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                <p style="font-weight: 600;">${a.title}</p>
                <p style="color: var(--text-light); font-size: 13px;">${new Date(a.created_at).toLocaleDateString()}</p>
                <p style="margin-top: 6px;">${a.body}</p>
            </div>
        `).join('');
    }

    checkSession();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--
    =========================================================================
    WHY THIS IS A SEPARATE FILE FROM index.html - read this first.

    index.html is the STAFF app - it has a big sidebar with 15+ admin
    pages, and everything in it assumes "whoever's logged in is a member
    of staff" (it looks them up in the `staff` table). A parent is NOT
    staff. If we tried to cram a parent view into the same file, we'd
    need to constantly check "wait, is this person staff or a parent?"
    on every single page, and a parent would see a sidebar full of
    buttons meant for running the school, not for checking on their kid.

    So this is its own small app instead - same Supabase project (same
    URL and key, since both apps talk to the same database), but its
    own simple login, its own simple set of tabs, and nothing a parent
    doesn't need to see. Much easier to keep parents safely in their own
    lane this way.
    =========================================================================
-->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #1e40af;
        --primary-dark: #1e3a8a;
        --bg-light: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-dark: #0f172a;
        --text-light: #64748b;
    }
    body { font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

    .login-container { display: flex; width: 100%; min-height: 100vh; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); align-items: center; justify-content: center; padding: 20px; }
    .login-container.hide { display: none; }
    .login-box { background: var(--card-bg); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .login-box h2 { margin-bottom: 6px; }
    .login-box p { color: var(--text-light); margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; }
    .login-message { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
    .login-message.error { display: block; background: #fee2e2; color: #991b1b; }
    .login-message.success { display: block; background: #dcfce7; color: #166534; }

    .app-container { display: none; max-width: 900px; margin: 0 auto; padding: 24px; }
    .app-container.show { display: block; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); }
    .top-bar h1 { font-size: 20px; }
    .top-bar p { color: var(--text-light); font-size: 13px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-light); }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h3 { margin-bottom: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { color: var(--text-light); font-size: 12px; text-transform: uppercase; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .empty-state { text-align: center; color: var(--text-light); padding: 20px; }

    .no-print {}
    @media print {
        body * { visibility: hidden; }
        #printOverlay, #printOverlay * { visibility: visible; }
        #printOverlay { position: absolute; top: 0; left: 0; }
        .no-print { display: none !important; }
    }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-box">
        <h2>Parent Portal</h2>
        <p>Sign in to view your child's information</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input id="loginEmail" type="email" placeholder="Email" required>
            <input id="loginPassword" type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>
        <div id="loginMessage" class="login-message"></div>
    </div>
</div>

<!-- MAIN APP -->
<div class="app-container" id="appContainer">
    <div class="top-bar">
        <div>
            <h1 id="topSchoolName">School</h1>
            <p id="topParentName"></p>
        </div>
        <div class="no-print" style="display: flex; align-items: center; gap: 12px;">
            <!-- Only shows if a parent has more than one child at this school -->
            <select id="childSelector" style="display: none; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px;" onchange="switchChild()"></select>
            <button class="btn" onclick="handleLogout()">Log Out</button>
        </div>
    </div>

    <div class="tabs no-print">
        <button class="tab-btn active" data-tab="attendance" onclick="switchTab('attendance')"><i class="fas fa-calendar-check"></i> Attendance</button>
        <button class="tab-btn" data-tab="homework" onclick="switchTab('homework')"><i class="fas fa-tasks"></i> Homework</button>
        <button class="tab-btn" data-tab="exams" onclick="switchTab('exams')"><i class="fas fa-file-lines"></i> Exams</button>
        <button class="tab-btn" data-tab="fees" onclick="switchTab('fees')"><i class="fas fa-money-bill"></i> Fees</button>
        <button class="tab-btn" data-tab="messages" onclick="switchTab('messages')"><i class="fas fa-comments"></i> Messages <span id="parentUnreadBadge" style="display: none; background: #dc2626; color: white; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;"></span></button>
        <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')"><i class="fas fa-bullhorn"></i> Announcements</button>
    </div>

    <!-- Attendance -->
    <div class="tab-page" id="tab-attendance">
        <div class="card">
            <h3>Attendance</h3>
            <p id="attSummary" style="color: var(--text-light); margin-bottom: 12px;"></p>
            <canvas id="attChart" height="150"></canvas>
        </div>
    </div>

    <!-- Homework -->
    <div class="tab-page" id="tab-homework" style="display: none;">
        <div class="card">
            <h3>Homework</h3>
            <table>
                <thead><tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th>Marks</th><th>Feedback</th></tr></thead>
                <tbody id="homeworkList"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Exams -->
    <div class="tab-page" id="tab-exams" style="display: none;">
        <div class="card">
            <h3>Exams</h3>
            <table>
                <thead><tr><th>Exam</th><th>Term</th><th></th></tr></thead>
                <tbody id="examsList"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Fees -->
    <div class="tab-page" id="tab-fees" style="display: none;">
        <div class="card">
            <h3>Fees</h3>
            <table>
                <thead><tr><th>Month</th><th>Amount Due</th><th>Status</th></tr></thead>
                <tbody id="feesList"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Messages -->
    <div class="tab-page" id="tab-messages" style="display: none;">
        <div class="card">
            <h3>Messages with Teachers</h3>
            <div id="messageThread" style="max-height: 350px; overflow-y: auto; margin-bottom: 16px;"></div>
            <div style="display: flex; gap: 8px;">
                <input id="newMessageBody" placeholder="Type a message..." style="flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px;">
                <button class="btn btn-primary" onclick="sendParentMessage()"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
    </div>

    <!-- Announcements -->
    <div class="tab-page" id="tab-announcements" style="display: none;">
        <div class="card">
            <h3>Announcements</h3>
            <div id="announcementsList"></div>
        </div>
    </div>
</div>

<!-- Printable report card overlay -->
<div id="printOverlay" style="display: none; position: fixed; inset: 0; background: white; z-index: 999; overflow-y: auto; padding: 40px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div class="no-print" style="margin-bottom: 24px; display: flex; gap: 10px;">
            <button class="btn" onclick="document.getElementById('printOverlay').style.display='none'"><i class="fas fa-times"></i> Close</button>
            <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print / Save as PDF</button>
        </div>
        <div id="printContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="portal.js"></script>
</body>
</html>
